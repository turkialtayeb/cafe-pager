<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>شاشة العرض</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{overflow:hidden}
.board{height:100dvh;display:grid;grid-template-columns:40% 1fr;gap:24px;padding:24px}
.left{background:var(--paper);border:1px solid var(--line);border-radius:32px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;text-align:center}
.left .logo{height:clamp(50px,9vh,100px)}
.left h1{margin:0;font-size:clamp(26px,3.2vw,52px);color:var(--brown);line-height:1.25}
#qr{background:#fffdf7;padding:14px;border-radius:22px;border:6px solid var(--olive);line-height:0}
.how{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.how div{background:var(--beige);border-radius:18px;padding:12px;font-size:clamp(12px,1.35vw,20px);line-height:1.6;text-align:right}
.how b{color:var(--brown);display:block}
.right{display:flex;flex-direction:column;gap:20px;min-height:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:32px;padding:24px;min-height:0;overflow:hidden}
.panel.rd{flex:3}.panel.pp{flex:2}
.panel h2{margin:0 0 14px;font-size:clamp(20px,2.4vw,36px);color:var(--mute)}
.nums{display:flex;flex-wrap:wrap;gap:14px}
.num{font-family:'Reem Kufi',serif;line-height:1;padding:10px 28px;border-radius:26px}
.rd .num{font-size:clamp(56px,8vw,130px);background:var(--brown);color:var(--beige)}
.rd .num.new{animation:pop .8s 4}@keyframes pop{50%{transform:scale(1.15)}}
.pp .num{font-size:clamp(30px,3.8vw,60px);background:var(--beige);color:var(--olive)}
@media(prefers-reduced-motion:reduce){.rd .num.new{animation:none}}
#snd{position:fixed;bottom:10px;left:10px;opacity:.5;font-size:12px;padding:6px 10px}
#msg{position:fixed;top:6px;right:50%;transform:translateX(50%)}
</style></head><body>
<div id="login" class="lg"><div class="lgc"><img class="logo" src="logo.png" alt="" onerror="this.remove()"><div class="brand">شاشة العرض</div><div class="sub">سجّل دخول الأدمن مرة وحدة على الآيباد</div>
<input id="em" type="email" placeholder="الإيميل" dir="ltr"><input id="pw" type="password" placeholder="كلمة المرور" dir="ltr"><button id="in">دخول</button><div id="le" class="er"></div></div></div>
<main class="board">
  <section class="left"><img class="logo" src="logo.png" alt="" onerror="this.remove()"><h1>امسح الكود<br>لتتبع طلبك</h1><div id="qr"></div>
    <div class="how"><div><b>آيفون</b>امسح الكود، ثم مشاركة &larr; إضافة إلى الشاشة الرئيسية، وافتحه من الأيقونة</div><div><b>أندرويد</b>امسح الكود، واكتب رقم طلبك، ووافق على التنبيهات</div></div></section>
  <section class="right"><div class="panel rd"><h2>جاهز للاستلام</h2><div class="nums" id="R"></div></div><div class="panel pp"><h2>قيد التحضير</h2><div class="nums" id="P"></div></div></section>
</main>
<div id="msg" class="er"></div><button id="snd">تفعيل صوت الشاشة</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,onSnapshot,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[<>&"']/g,'');
let ac=null,seen=null,sub=null;
const s=Math.round(Math.min(innerWidth*.28,innerHeight*.42));
new QRCode($('qr'),{text:location.href.split('?')[0].replace(/display\.html.*$/,''),width:s,height:s});
function chime(){if(!ac)return;[880,1175,1568].forEach((f,i)=>{const t=ac.currentTime+i*.22,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.65)})}
$('snd').onclick=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();chime();$('snd').textContent='الصوت مفعّل'};
const app=initializeApp(FB.config),auth=getAuth(app),db=getFirestore(app);
const login=()=>signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value).catch(e=>$('le').textContent='الإيميل أو كلمة المرور غلط ['+e.code+']');
$('in').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};
onAuthStateChanged(auth,u=>{$('login').hidden=!!u;if(u&&!sub)sub=onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(100)),x=>draw(x.docs.map(d=>d.data())),e=>$('msg').textContent=e.code)});
function draw(l){
  const rd=l.filter(o=>o.status==='ready').sort((a,b)=>(b.readyAt||0)-(a.readyAt||0)),pp=l.filter(o=>o.status==='preparing').sort((a,b)=>a.eta-b.eta);
  const fresh=seen?rd.filter(o=>!seen.has(o.number)).map(o=>o.number):[];seen=new Set(rd.map(o=>o.number));if(fresh.length)chime();
  $('R').innerHTML=rd.map(o=>'<span class="num'+(fresh.includes(o.number)?' new':'')+'">'+esc(o.number)+'</span>').join('')||'<div class="sub">ما فيه طلبات جاهزة حالياً</div>';
  $('P').innerHTML=pp.map(o=>'<span class="num">'+esc(o.number)+'</span>').join('')||'<div class="sub">ما فيه طلبات قيد التحضير</div>'}
</script></body></html>
