<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تتبع الطلب</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#143830">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><main class="scr" id="scr"></main>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc,getDoc,onSnapshot,updateDoc,arrayUnion} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getMessaging,getToken,isSupported} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js';
const app=initializeApp(FB.config),db=getFirestore(app),$=i=>document.getElementById(i),C=2*Math.PI*100;
let cafe='',mine=null,state=null,unsub=null,ac=null,alarm=null,push=null,sig='',errMsg='';
const esc=s=>String(s).replace(/[<>&"]/g,''),fmt=s=>Math.floor(s/60)+':'+('0'+s%60).slice(-2),left=()=>Math.max(0,Math.ceil((state.eta-Date.now())/1000));
const ios=/iphone|ipad/i.test(navigator.userAgent),standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
addEventListener('pointerdown',unlock);
function chime(){if(!ac)return;[880,1175,1568].forEach((f,i)=>{const t=ac.currentTime+i*.22,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.65)})}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}};
function startAlarm(){if(alarm)return;chime();buzz();alarm=setInterval(()=>{chime();buzz()},2000)}
function stopAlarm(){clearInterval(alarm);alarm=null}
onSnapshot(doc(db,'settings','main'),s=>{cafe=s.exists()?s.data().name:'اسم الكوفي';document.title=cafe;paint()});
function paint(){
  const k=[cafe,mine,state&&state.status,state&&state.eta,push,errMsg].join('|');if(k===sig)return;sig=k;
  const s=$('scr'),h='<div class="brand">'+esc(cafe)+'</div>';
  if(!state){s.className='scr';s.innerHTML=h+'<div class="sub">تابع طلبك من جوالك</div><div class="mid"><input id="in" inputmode="numeric" placeholder="رقم الطلب" aria-label="رقم الطلب"><button class="cta" id="go">تتبع طلبي</button><div class="er">'+esc(errMsg)+'</div><div class="sub">بنبلغك بصوت وتنبيه أول ما يجهز</div></div>'+(ios&&!standalone?'<div class="sub">آيفون: اضغط مشاركة ثم «إضافة إلى الشاشة الرئيسية» وافتح الموقع من الأيقونة عشان توصلك التنبيهات</div>':'');
    $('go').onclick=()=>track();$('in').onkeydown=e=>e.key==='Enter'&&track()}
  else if(state.status==='ready'){s.className='scr ready';s.innerHTML=h+'<div class="mid"><div style="font-size:26px;font-weight:700">طلبك جاهز</div><div class="bign">'+esc(mine)+'</div><div>تفضل بالاستلام من الكاونتر</div></div><button class="cta" style="background:#2a1a05;color:#fff" id="got">استلمت طلبي</button>';$('got').onclick=leave}
  else{s.className='scr';s.innerHTML=h+'<div class="sub">طلب رقم '+esc(mine)+'</div><div class="mid"><div class="ring"><svg width="220" height="220"><circle cx="110" cy="110" r="100" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/><circle id="arc" cx="110" cy="110" r="100" fill="none" stroke="#e0a244" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C+'"/></svg><div class="in"><div class="t" id="cd"></div><div class="sub">الوقت المتوقع</div></div></div><div class="sub">'+(push?'التنبيهات مفعّلة، تقدر تقفل الشاشة':'التنبيهات غير مفعّلة، أبقِ الصفحة مفتوحة ليشتغل الصوت')+'</div></div>';tick()}
}
function tick(){if(state&&state.status==='preparing'){const l=left(),c=$('cd'),a=$('arc');if(c)c.textContent=fmt(l);if(a)a.setAttribute('stroke-dashoffset',C*(1-Math.min(1,l/state.total)))}}
setInterval(tick,1000);
async function track(n){n=(n||$('in').value).trim();if(!n)return;unlock();
  try{const s=await getDoc(doc(db,'orders',n));if(!s.exists()||s.data().status==='picked'){errMsg='ما لقينا هذا الرقم، تأكد منه';sig='';paint();return}}catch(e){errMsg='تعذر الاتصال، حاول مرة ثانية';sig='';paint();return}
  errMsg='';mine=n;localStorage.setItem('order',n);unsub&&unsub();
  unsub=onSnapshot(doc(db,'orders',n),x=>{state=x.exists()?x.data():null;if(!state||state.status==='picked'){leave();return}if(state.status==='ready')startAlarm();paint()});
  enablePush(n)}
function leave(){stopAlarm();unsub&&unsub();mine=null;state=null;errMsg='';localStorage.removeItem('order');sig='';paint()}
async function enablePush(n){try{throw 0;if(!(await isSupported()))throw 0;if(await Notification.requestPermission()!=='granted')throw 0;
  const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');
  const t=await getToken(getMessaging(app),{vapidKey:FB.vapidKey,serviceWorkerRegistration:reg});
  await updateDoc(doc(db,'orders',n),{tokens:arrayUnion(t)});push=true}catch(e){push=false}paint()}
const p=new URLSearchParams(location.search).get('o')||localStorage.getItem('order');p?track(p):paint();
</script></body></html>
