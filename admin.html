<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأدمن</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div class="page">
<div id="login" class="panel" style="max-width:360px;margin:60px auto;flex-direction:column;align-items:stretch">
  <div class="brand">دخول الأدمن</div><input id="em" type="email" placeholder="الإيميل" dir="ltr"><input id="pw" type="password" placeholder="كلمة المرور" dir="ltr"><button id="in">دخول</button><div id="le" class="empty"></div></div>
<div id="app" hidden>
  <div class="bar"><label for="cn">اسم الكوفي</label><input id="cn" style="width:150px"><button id="sv">حفظ</button>
   <label for="nn">طلب جديد</label><input id="nn" inputmode="numeric" placeholder="الرقم" style="width:80px"><input id="nm" inputmode="numeric" value="10" style="width:64px" aria-label="دقائق"><span class="sub">دقيقة</span><button id="ad">إضافة</button>
   <button id="so" style="margin-inline-start:auto;background:var(--line);color:var(--ink)">خروج</button></div>
  <div class="cols"><div class="col"><h3>قيد التحضير</h3><div id="L1"></div></div><div class="col"><h3>جاهزة للاستلام</h3><div id="L2"></div></div></div>
  <div class="panel" style="margin-top:20px"><b>باركود الموقع</b><input id="url" dir="ltr" style="flex:1;min-width:220px"><button id="mq">تحديث</button><button id="pr">طباعة الملصق</button></div>
</div></div>
<div id="poster" hidden><div class="brand" id="pn" style="font-size:48px"></div><p style="font-size:22px">امسح الباركود وتابع طلبك من جوالك</p><div id="qr"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,setDoc,updateDoc,collection,onSnapshot,query,orderBy,limit,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp(FB.config),auth=getAuth(app),db=getFirestore(app),$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[<>&"']/g,''),fmt=s=>Math.floor(s/60)+':'+('0'+s%60).slice(-2);
let list=[],started=false;
$('in').onclick=()=>signInWithEmailAndPassword(auth,$('em').value,$('pw').value).catch(()=>$('le').textContent='الإيميل أو كلمة المرور غلط');
$('so').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$('login').hidden=!!u;$('app').hidden=!u;if(u&&!started){started=true;start()}});
function start(){
  $('url').value=location.href.replace(/admin\.html.*$/,'');
  getDoc(doc(db,'settings','main')).then(s=>{$('cn').value=s.exists()?s.data().name:'';mq()});
  onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(100)),s=>{list=s.docs.map(d=>d.data());render()});
  setInterval(tickAll,1000)}
$('sv').onclick=async()=>{await setDoc(doc(db,'settings','main'),{name:$('cn').value});mq()};
$('ad').onclick=async()=>{const n=$('nn').value.trim(),m=parseInt($('nm').value)||10;if(!n)return;
  await setDoc(doc(db,'orders',n),{number:n,eta:Date.now()+m*60000,total:m*60,status:'preparing',tokens:[],createdAt:Date.now()});$('nn').value=''};
window.adj=(n,d)=>{const o=list.find(x=>x.number===n),eta=Math.max(Date.now()+30000,o.eta+d*60000);updateDoc(doc(db,'orders',n),{eta,total:Math.max(o.total,Math.ceil((eta-Date.now())/1000))})};
window.st=(n,s)=>updateDoc(doc(db,'orders',n),{status:s});
function render(){let a='',b='';
  list.forEach(o=>{const n=esc(o.number);
    if(o.status==='preparing')a+='<div class="o"><div class="h"><span class="n">'+n+'</span><span class="c" data-e="'+o.eta+'"></span></div><div class="acts"><button onclick="adj(\''+n+'\',-2)">−2</button><button onclick="adj(\''+n+'\',2)">+2</button><button onclick="adj(\''+n+'\',5)">+5</button><button class="ok" onclick="st(\''+n+'\',\'ready\')">جاهز</button></div></div>';
    else if(o.status==='ready')b+='<div class="o done"><div class="h"><span class="n">'+n+'</span><button onclick="st(\''+n+'\',\'picked\')">تم التسليم</button></div></div>'});
  $('L1').innerHTML=a||'<div class="empty">ما فيه طلبات</div>';$('L2').innerHTML=b||'<div class="empty">ما فيه طلبات</div>';tickAll()}
function tickAll(){document.querySelectorAll('[data-e]').forEach(e=>e.textContent=fmt(Math.max(0,Math.ceil((e.dataset.e-Date.now())/1000))))}
function mq(){$('qr').innerHTML='';new QRCode($('qr'),{text:$('url').value,width:260,height:260});$('pn').textContent=$('cn').value}
$('mq').onclick=mq;$('pr').onclick=()=>{mq();$('poster').hidden=false;print();$('poster').hidden=true};
</script></body></html>
